[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ravelry-discovery-portfolio"
version = "0.2.0"
description = "Independent pattern discovery product analytics case study"
requires-python = ">=3.10"
dependencies = [
 "requests>=2.32,<3", "python-dotenv>=1,<2", "duckdb>=1.1,<2",
 "dbt-core>=1.11,<1.12", "dbt-duckdb>=1.10,<1.11", "pandas>=2.2,<3",
 "numpy>=2,<3", "scipy>=1.14,<2", "statsmodels>=0.14,<0.15", "matplotlib>=3.9,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
